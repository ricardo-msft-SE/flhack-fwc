<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Software Request Intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #10202f;
      --muted: #5b6873;
      --canvas-a: #eaf4ff;
      --canvas-b: #fff6e9;
      --stroke: #dbe7f1;
      --surface: rgba(255, 255, 255, 0.9);
      --brand: #0c69b0;
      --brand-2: #dd7a17;
      --ok: #007f5f;
      --warn: #8a5200;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, var(--canvas-a) 0, transparent 36%),
        radial-gradient(circle at 95% 2%, var(--canvas-b) 0, transparent 30%),
        linear-gradient(120deg, #f9fbff 0%, #ffffff 100%);
      padding: 20px;
    }
    .app {
      max-width: 980px;
      margin: 0 auto;
      border: 1px solid var(--stroke);
      background: var(--surface);
      border-radius: 24px;
      box-shadow: 0 14px 38px rgba(16, 32, 47, 0.1);
      overflow: hidden;
    }
    .hero {
      padding: 20px 24px;
      background: linear-gradient(100deg, rgba(12, 105, 176, 0.1), rgba(221, 122, 23, 0.12));
      border-bottom: 1px solid var(--stroke);
    }
    h1 {
      font-family: "Sora", "Segoe UI", sans-serif;
      margin: 0 0 6px;
      font-size: 1.4rem;
    }
    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 0.98rem;
    }
    .content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      padding: 18px;
    }
    .panel {
      border: 1px solid var(--stroke);
      border-radius: 14px;
      background: #fff;
      padding: 14px;
      min-height: 320px;
    }
    .panel h2 {
      font-family: "Sora", "Segoe UI", sans-serif;
      margin: 0 0 8px;
      font-size: 1.05rem;
    }
    .status-row {
      border: 1px solid var(--stroke);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      background: #fafcff;
      display: grid;
      gap: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 10px;
      font-weight: 700;
      font-size: 0.78rem;
      color: #fff;
      width: fit-content;
    }
    .badge-running { background: var(--warn); }
    .badge-completed { background: var(--ok); }
    .badge-error { background: var(--err); }
    .button-row {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 700;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
    }
    button.primary { background: var(--brand); color: #fff; }
    button.secondary { background: #fff; color: var(--ink); border-color: var(--stroke); }
    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    #reportFrame {
      width: 100%;
      min-height: 460px;
      border: 1px solid var(--stroke);
      border-radius: 12px;
      background: #fff;
    }
    @media (max-width: 900px) {
      .content { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>Software Request Workspace</h1>
      <p class="subtitle">Submit a request via Adaptive Card, monitor agent status, and open the final HTML report.</p>
    </header>

    <section class="content">
      <div class="panel">
        <h2>Request Intake</h2>
        <div id="cardHost"></div>
        <div class="hint">Tenant: ecb61531-f7e1-4390-9633-9213f6c9c05c</div>

        <div class="status-row" id="statusPanel" hidden>
          <div><strong>Request ID:</strong> <span id="requestId">-</span></div>
          <div><strong>Session ID:</strong> <span id="sessionId">-</span></div>
          <div><strong>Status:</strong> <span id="statusBadge" class="badge badge-running">running</span></div>
          <div><strong>Recommendation:</strong> <span id="recommendation">Pending</span></div>
          <div class="button-row">
            <button id="openReport" class="secondary" disabled>Open HTML Report</button>
            <button id="approveBtn" class="primary" disabled>Approve In-App</button>
            <button id="rejectBtn" class="secondary" disabled>Reject In-App</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Report Viewer</h2>
        <iframe id="reportFrame" title="Final report output"></iframe>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/adaptivecards/dist/adaptivecards.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
